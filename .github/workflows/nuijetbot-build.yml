name: Build NuiJetBot APK
on:
  push:
    branches: [ tmp-nuijet-bot-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate Android project
        run: |
          cat nuijetbot-src.aa nuijetbot-src.ab nuijetbot-src.ac nuijetbot-src.ad > nuijetbot-src.b64
          printf '%s' 'cmFkbGVVVAUAA979vGp1eAsAAQQAAAAABOkDAABQSwECHgMUAAAACAAxYj5dsqJfX0YAAABJAAAADAAYAAAAAAABAAAApIFPKwAAYnVpbGQuZ3JhZGxlVVQFAAPe/bxqdXgLAAEEAAAAAATpAwAAUEsBAh4DFAAAAAgAMWI+XSwyI5mtAAAARgEAAA8AGAAAAAAAAQAAAKSB2ysAAHNldHRpbmdzLmdyYWRsZVVUBQAD3v28anV4CwABBAAAAAAE6QMAAFBLBQYAAAAAFwAXAK8IAADRLAAAAAA=' >> nuijetbot-src.b64
          base64 -d nuijetbot-src.b64 > nuijetbot-src.zip
          mkdir NuiJetBot
          cd NuiJetBot
          unzip ../nuijetbot-src.zip
      - name: Apply NuiJetBot v0.2 MediaProjection fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("NuiJetBot/app/src/main/java/com/nuijet/bot/CaptureService.java")
          s = p.read_text()

          s = s.replace(
              "import android.content.Intent;\n",
              "import android.content.Intent;\nimport android.content.pm.ServiceInfo;\n"
          )

          s = s.replace(
              'startForeground(NOTIF_ID, notification("Nui Jet Bot actiu"));',
              'startForeground(NOTIF_ID, notification("Nui Jet Bot actiu"), ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);'
          )

          s = s.replace(
              "    private void startCapture(int resultCode, Intent data) {\n        stopCapture();",
              "    private void startCapture(int resultCode, Intent data) {\n        if (active) return;"
          )

          old = "            if (data != null) startCapture(resultCode, data);"
          new = """            if (data != null) {
                try {
                    startCapture(resultCode, data);
                } catch (Throwable t) {
                    android.util.Log.e("NuiJetBot", "MediaProjection startup failed", t);
                    BotAccessibilityService.setStatus("NUI ERROR: " + t.getClass().getSimpleName());
                    stopCapture();
                    stopSelf();
                }
            }"""
          s = s.replace(old, new)
          p.write_text(s)

          g = Path("NuiJetBot/app/build.gradle")
          t = g.read_text().replace("versionCode 1", "versionCode 2").replace('versionName "0.1"', 'versionName "0.2"')
          g.write_text(t)

          m = Path("NuiJetBot/app/src/main/java/com/nuijet/bot/MainActivity.java")
          u = m.read_text().replace('title.setText("Nui Jet Bot v0.1");', 'title.setText("Nui Jet Bot v0.2");')
          m.write_text(u)
          PY
      - name: Apply NuiJetBot v0.3 steering fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("NuiJetBot/app/src/main/java/com/nuijet/bot/CaptureService.java")
          s = p.read_text()

          s = s.replace("private static final long TAP_COOLDOWN_MS = 105;", "private static final long TAP_COOLDOWN_MS = 190;")
          s = s.replace("private static final float PLAYER_DEADBAND = 18f;", "private static final float PLAYER_DEADBAND = 10f;")
          s = s.replace("    private int sameDirectionCount = 0;\n    private int previousDirection = 0;",
                        "    private int previousDirection = 0;\n    private long reverseLockUntilMs = 0;")

          new_analyze = r'''
    private void analyze(ByteBuffer buf, int rowStride, int pixelStride, long now) {
        if (looksLikeResult(buf, rowStride, pixelStride)) {
            BotAccessibilityService.setStatus("NUI: RETRY");
            if (now - lastRetryMs > 1800) {
                lastRetryMs = now;
                tapScreen(0.665f, 0.812f);
            }
            return;
        }

        if (!looksLikeGame(buf, rowStride, pixelStride)) {
            BotAccessibilityService.setStatus("NUI: ESPERANT");
            return;
        }

        float px = estimatePlayerX(buf, rowStride, pixelStride);
        if (!Float.isNaN(px)) lastPlayerX = 0.68f * lastPlayerX + 0.32f * px;
        px = lastPlayerX;

        // v0.3: only examine the approach zone ABOVE the rider.
        // v0.2 scanned too low and could classify parts of the jetski/rider as rocks.
        double[] colRisk = new double[CAP_W];
        int yStart = (int)(0.28f * capH);
        int yEnd   = (int)(0.60f * capH);

        for (int y = yStart; y < yEnd; y += 4) {
            double yn = (y - yStart) / (double)Math.max(1, yEnd - yStart);
            int margin = (int)((0.22f - 0.12f * yn) * CAP_W);
            int x0 = Math.max(margin, (int)(0.06f * CAP_W));
            int x1 = Math.min(CAP_W - margin, (int)(0.94f * CAP_W));

            for (int x = x0; x < x1; x += 3) {
                int off = y * rowStride + x * pixelStride;
                if (off < 0 || off + 2 >= buf.limit()) continue;
                int r = buf.get(off) & 255;
                int g = buf.get(off + 1) & 255;
                int b = buf.get(off + 2) & 255;
                if (!isRockPixel(r, g, b)) continue;

                // Reject isolated dark pixels. Real rocks occupy several nearby samples.
                int neighbours = 0;
                for (int dx = -9; dx <= 9; dx += 6) {
                    int xx = x + dx;
                    if (xx < x0 || xx >= x1) continue;
                    int oo = y * rowStride + xx * pixelStride;
                    if (oo < 0 || oo + 2 >= buf.limit()) continue;
                    int rr = buf.get(oo) & 255;
                    int gg = buf.get(oo + 1) & 255;
                    int bb = buf.get(oo + 2) & 255;
                    if (isRockPixel(rr, gg, bb)) neighbours++;
                }
                if (neighbours < 2) continue;

                double weight = 0.12 + 1.35 * yn * yn + 4.2 * Math.pow(yn, 5);
                int radius = (int)(9 + 16 * yn);
                int a = Math.max(0, x - radius);
                int z = Math.min(CAP_W - 1, x + radius);
                for (int xx = a; xx <= z; xx++) {
                    double d = Math.abs(xx - x) / (double)(radius + 1);
                    colRisk[xx] += weight * (1.0 - d);
                }
            }
        }

        double currentRisk = corridorRisk(colRisk, px);
        float leftNearX  = clampTrack(px - 48f);
        float rightNearX = clampTrack(px + 48f);
        float leftFarX   = clampTrack(px - 88f);
        float rightFarX  = clampTrack(px + 88f);

        double leftScore =
                0.70 * corridorRisk(colRisk, leftNearX) +
                0.30 * corridorRisk(colRisk, leftFarX) +
                edgePenalty(leftFarX);

        double rightScore =
                0.70 * corridorRisk(colRisk, rightNearX) +
                0.30 * corridorRisk(colRisk, rightFarX) +
                edgePenalty(rightFarX);

        // Do NOT steer just to return to centre. Coast while the current corridor is safe.
        final double DANGER = 0.72;
        int desired = 0;
        if (currentRisk > DANGER) {
            if (px < CAP_W * 0.16f) desired = 1;
            else if (px > CAP_W * 0.84f) desired = -1;
            else desired = leftScore <= rightScore ? -1 : 1;
        }

        // Anti ping-pong: after committing to one direction, an immediate reversal is blocked.
        if (desired != 0 && previousDirection != 0 && desired != previousDirection && now < reverseLockUntilMs) {
            desired = 0;
        }

        String dirText = desired < 0 ? "←" : desired > 0 ? "→" : "·";
        BotAccessibilityService.setStatus(
                "NUI " + dirText +
                " x=" + Math.round(px) +
                " R=" + Math.round(currentRisk * 10.0) / 10.0
        );

        if (desired != 0 && now - lastTapMs >= TAP_COOLDOWN_MS) {
            lastTapMs = now;
            if (desired != previousDirection) {
                previousDirection = desired;
                reverseLockUntilMs = now + 520;
            }
            if (desired < 0) tapScreen(0.22f, 0.66f);
            else tapScreen(0.78f, 0.66f);
        }

        // Once clear, forget the previous direction after the reversal lock expires.
        if (currentRisk < 0.25 && now >= reverseLockUntilMs) {
            previousDirection = 0;
        }
    }

    private double corridorRisk(double[] risk, float x) {
        int cx = Math.round(x);
        int half = 16;
        int a = Math.max(0, cx - half);
        int b = Math.min(CAP_W - 1, cx + half);
        if (b < a) return 999.0;
        double sum = 0.0;
        for (int i = a; i <= b; i++) sum += risk[i];
        return sum / (b - a + 1);
    }

    private float clampTrack(float x) {
        float lo = CAP_W * 0.12f;
        float hi = CAP_W * 0.88f;
        return Math.max(lo, Math.min(hi, x));
    }

    private double edgePenalty(float x) {
        double edge = Math.abs(x - CAP_W / 2.0) / (CAP_W / 2.0);
        return 0.18 * Math.pow(edge, 5);
    }

'''
          s = re.sub(r'    private void analyze\(ByteBuffer buf, int rowStride, int pixelStride, long now\) \{.*?\n    private boolean looksLikeGame',
                     new_analyze + '    private boolean looksLikeGame',
                     s, flags=re.S)

          p.write_text(s)

          g = Path("NuiJetBot/app/build.gradle")
          t = g.read_text().replace("versionCode 2", "versionCode 3").replace('versionName "0.2"', 'versionName "0.3"')
          g.write_text(t)

          m = Path("NuiJetBot/app/src/main/java/com/nuijet/bot/MainActivity.java")
          u = m.read_text().replace('title.setText("Nui Jet Bot v0.2");', 'title.setText("Nui Jet Bot v0.3");')
          u = u.replace("Detecta roques, toca esquerra/dreta i fa auto-retry.",
                        "v0.3: evita oscil·lacions, només gira quan hi ha risc real i fa auto-retry.")
          m.write_text(u)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APKs
        working-directory: NuiJetBot
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NuiJetBot-stable-signing-input
          path: |
            NuiJetBot/app/build/outputs/apk/release/app-release-unsigned.apk
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
