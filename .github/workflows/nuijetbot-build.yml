name: Build NuiJetBot APK
on:
  push:
    branches: [ tmp-nuijet-bot-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recreate Android project
        run: |
          base64 -d nuijetbot-src.b64 > nuijetbot-src.zip
          mkdir NuiJetBot
          cd NuiJetBot
          unzip ../nuijetbot-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: NuiJetBot
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NuiJetBot-debug
          path: NuiJetBot/app/build/outputs/apk/debug/app-debug.apk
